name: Mirror to Xposed-Modules-Repo

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to mirror (e.g., v1.1.0 or 101-1.1.0)'
        required: true

concurrency:
  group: mirror-release
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG_NAME: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v7

      - name: Validate tag
        run: |
          if [[ ! "$TAG_NAME" =~ ^v ]] && [[ ! "$TAG_NAME" =~ ^[0-9] ]]; then
            echo "::error::Tag must start with 'v' or a version number (e.g. 101-1.1.0)"
            exit 1
          fi

      - name: Fetch release info
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # If triggered by tag push before a GitHub release is published, check if release exists
          if ! gh release view "$TAG_NAME" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG_NAME does not exist yet. Mirroring will run when release is published."
            exit 0
          fi
          gh release view "$TAG_NAME" --repo "$REPO" --json name,body,isPrerelease \
            --jq '"name=\(.name)\nprerelease=\(.isPrerelease)"' >> "$GITHUB_OUTPUT"
          echo "body<<BODY_EOF" >> "$GITHUB_OUTPUT"
          gh release view "$TAG_NAME" --repo "$REPO" --json body --jq '.body' >> "$GITHUB_OUTPUT"
          echo "BODY_EOF" >> "$GITHUB_OUTPUT"

      - name: Download APK from release
        if: steps.release.outputs.name != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p ./artifacts
          gh release download "$TAG_NAME" \
            --repo "$REPO" \
            --pattern "*.apk" \
            --dir ./artifacts
          apk_count=$(find ./artifacts -name '*.apk' | wc -l)
          echo "Found $apk_count APK(s)"
          [ "$apk_count" -gt 0 ] || { echo "::error::No APK found"; exit 1; }

          # Resolve Xposed-compliant tag format: [version code]-[version name]
          FIRST_APK=$(find ./artifacts -name '*.apk' | head -n 1)
          if command -v apkanalyzer >/dev/null 2>&1; then
            V_CODE=$(apkanalyzer manifest version-code "$FIRST_APK" 2>/dev/null || echo "")
            V_NAME=$(apkanalyzer manifest version-name "$FIRST_APK" 2>/dev/null || echo "")
          fi
          if [ -n "$V_CODE" ] && [ -n "$V_NAME" ]; then
            XPOSED_TAG="${V_CODE}-${V_NAME}"
          elif [[ "$TAG_NAME" =~ ^[0-9]+- ]]; then
            XPOSED_TAG="$TAG_NAME"
          else
            CLEAN_VER="${TAG_NAME#v}"
            CLEAN_CODE=$(echo "$CLEAN_VER" | tr -d '.')
            XPOSED_TAG="${CLEAN_CODE}-${CLEAN_VER}"
          fi
          echo "Xposed release tag: $XPOSED_TAG"
          echo "XPOSED_TAG=$XPOSED_TAG" >> "$GITHUB_ENV"

      - name: Sync metadata and README to Xposed repo
        if: steps.release.outputs.name != ''
        env:
          XPOSED_PAT: ${{ secrets.XPOSED_REPO_PAT }}
        run: |
          git clone "https://x-access-token:${XPOSED_PAT}@github.com/Xposed-Modules-Repo/io.github.official_arvind.cameratools.git" /tmp/xposed-repo
          cd /tmp/xposed-repo
          cp "${GITHUB_WORKSPACE}/README.md" ./README.md
          if [ -f "${GITHUB_WORKSPACE}/LICENSE" ]; then
            cp "${GITHUB_WORKSPACE}/LICENSE" ./LICENSE
          fi
          echo "https://github.com/official-Arvind/CameraTools" > ./SOURCE_URL
          if [ ! -f ./SUMMARY ]; then
            echo "CameraTools - Universal Camera Enhancement & Artificial Restriction Bypass for Xiaomi & AOSP" > ./SUMMARY
          fi
          # Strictly purge any non-metadata files to ensure zero source code is stored on the Xposed repo
          find . -maxdepth 1 -not -name '.git' -not -name '.' -not -name 'README.md' -not -name 'SOURCE_URL' -not -name 'SUMMARY' -not -name 'LICENSE' -exec rm -rf {} +
          git config user.name "official-Arvind"
          git config user.email "official-Arvind@users.noreply.github.com"
          git add README.md SOURCE_URL SUMMARY LICENSE
          if ! git diff --quiet || ! git diff --cached --quiet; then
            git commit -m "docs: sync README and metadata for ${XPOSED_TAG}"
            git push origin main
          fi

      - name: Create mirror release
        if: steps.release.outputs.name != ''
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          repository: Xposed-Modules-Repo/io.github.official_arvind.cameratools
          token: ${{ secrets.XPOSED_REPO_PAT }}
          tag_name: ${{ env.XPOSED_TAG }}
          target_commitish: main
          name: ${{ steps.release.outputs.name }}
          body: ${{ steps.release.outputs.body }}
          prerelease: ${{ steps.release.outputs.prerelease }}
          files: ./artifacts/*.apk
          fail_on_unmatched_files: true
          make_latest: true
