name: Bug report
description: Report a problem with CameraTools
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: What did you do, what did you expect, what happened instead.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Device and versions
      description: Device, Android version/ROM, module version, LSPosed version.
      placeholder: Redmi Note 12 Pro 5G, HyperOS 1.0.4.0, module 1.2.2, LSPosed 1.9.2
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs (required)
      description: >-
        Reproduce the issue, then immediately export logs via
        adb logcat -b crash and attach the file here as
        .zip or .txt (drag and drop into this field).
        Issues without logs will be closed.
      placeholder: Drag and drop the exported log file here.
    validations:
      required: true

